<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videoteca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎬%3C/text%3E%3C/svg%3E">
<style>
:root {
  --fondo: #f5f0e6; --panel: #fffdf8; --linea: #e2d9c8; --texto: #22201c; --suave: #7b7266;
  --acento: #b4361f; --acento-2: #1f5f5b; --radio: 4px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--texto); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
img { display: block; }
button { font: inherit; color: inherit; }
.envoltura { max-width: 1240px; margin: 0 auto; padding: 0 16px 80px; }

header { padding: 40px 0 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; border-bottom: 3px double var(--texto); }
h1 { font-weight: 400; font-size: clamp(34px, 6vw, 56px); margin: 0; letter-spacing: -0.02em; line-height: 1; }
h1 small { display: block; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--suave); margin-bottom: 10px; }
.cifras { display: flex; gap: 22px; color: var(--suave); font-size: 13px; }
.cifras b { display: block; color: var(--texto); font-size: 24px; font-weight: 400; }

nav { position: sticky; top: 0; z-index: 5; background: var(--fondo); display: flex; gap: 4px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
nav button { font-size: 15px; background: none; border: 0; color: var(--suave); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
nav button[aria-pressed="true"] { background: var(--acento); color: #fff; }
nav .azar { color: var(--acento-2); border: 1px solid var(--acento-2); margin-left: 6px; }
nav input { margin-left: auto; font: inherit; font-size: 15px; background: var(--panel); color: var(--texto); border: 1px solid var(--linea); border-radius: 999px; padding: 8px 14px; width: min(260px, 100%); }

section { margin-top: 38px; }
h2 { font-weight: 400; font-style: italic; font-size: 26px; margin: 0 0 4px; }
.sub { color: var(--suave); font-size: 14px; margin: 0 0 18px; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
.filtros button { font-size: 14px; border: 1px solid var(--linea); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.filtros button[aria-pressed="true"] { border-color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }

/* fichas: lista con miniatura */
.lista .ficha { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--linea); cursor: pointer; }
.lista .ficha:hover { background: var(--panel); }
.cartel { aspect-ratio: 2 / 3; overflow: hidden; background: var(--panel); position: relative; border-radius: 2px; }
.cartel img { width: 100%; height: 100%; object-fit: cover; }
.sin { position: absolute; inset: 0; display: flex; align-items: flex-start; padding: 10px; font-size: 16px; line-height: 1.15; color: #fff; }
.lista .sin { font-size: 0; }
.ficha h3 { margin: 0; font-size: 18px; font-weight: 400; line-height: 1.25; }
.ficha p { margin: 2px 0 0; color: var(--suave); font-size: 13px; }
.ficha .motivo { font-size: 13px; }
.punt { font-size: 22px; }
.na { display: inline-block; margin-left: 8px; vertical-align: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--acento-2); color: #fff; border-radius: 999px; padding: 3px 8px; font-family: system-ui, sans-serif; }

/* podio y carrusel con carteles */
.podio { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.fila { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
.podio .ficha, .fila .ficha { position: relative; cursor: pointer; }
.podio .cartel, .fila .cartel { box-shadow: 0 10px 24px -14px rgba(60,40,10,.6); border-radius: 3px; }
.podio .ficha h3, .fila .ficha h3 { font-size: 15px; font-weight: 600; margin-top: 9px; }
.insignia { position: absolute; left: 8px; bottom: 8px; font-size: 18px; background: rgba(0,0,0,.55); border-radius: 999px; padding: 2px 7px; }
.num { font-size: 64px; line-height: .8; color: var(--acento); position: absolute; left: -6px; top: -14px; z-index: 2; background: var(--fondo); padding: 0 6px 2px 2px; }
@media (max-width: 760px) { .podio { grid-template-columns: repeat(3, 1fr); } .num { font-size: 44px; } }

.tramo { margin-top: 30px; }
.tramo h3.cab { display: flex; align-items: baseline; gap: 10px; font-weight: 400; font-size: 21px; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--texto); }
.tramo h3.cab span { color: var(--suave); font-size: 13px; }

/* estadísticas */
.barras { display: grid; gap: 8px; max-width: 640px; }
.barra { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 15px; }
.barra i { display: block; height: 14px; background: var(--acento); border-radius: 2px; }
.barra.b2 i { background: var(--acento-2); }
.barra span:last-child { color: var(--suave); text-align: right; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }

/* ficha ampliada */
dialog { border: 0; padding: 0; background: var(--panel); color: var(--texto); border-radius: 6px; max-width: 640px; width: calc(100% - 32px); box-shadow: 0 30px 80px -20px rgba(40,25,5,.5); }
dialog::backdrop { background: rgba(34,32,28,.55); }
.amp { display: grid; grid-template-columns: 200px 1fr; gap: 22px; padding: 22px; }
.amp h2 { font-style: normal; font-size: 28px; line-height: 1.1; margin-bottom: 6px; }
.amp .cartel { border-radius: 3px; }
.amp dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 14px 0; }
.amp dt { color: var(--suave); }
.amp dd { margin: 0; }
.amp .coment { font-size: 15px; line-height: 1.5; white-space: pre-wrap; border-left: 3px solid var(--acento); padding-left: 12px; }
.amp .acciones { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.amp a, .amp button { font-size: 14px; text-decoration: none; border: 1px solid var(--linea); border-radius: 999px; padding: 7px 14px; background: var(--fondo); color: var(--texto); cursor: pointer; }
.amp a.prin { background: var(--acento); border-color: var(--acento); color: #fff; }
@media (max-width: 560px) { .amp { grid-template-columns: 1fr; } .amp .cartel { width: 150px; } }

.vacio { color: var(--suave); padding: 30px 0; }
footer { margin-top: 60px; color: var(--suave); font-size: 13px; }
</style>
</head>

  <header>
    <h1><small>Bibloteca de Alejandria</small>Videoteca</h1>
    <div class="cifras" id="cifras"></div>
  </header>

    <button data-vista="inicio" aria-pressed="true">Inicio</button>

  </nav>
  <main id="main"></main>
  <footer id="pie"></footer>
</div>

const porSaga = (a, b) => (a.saga || a.titulo).localeCompare(b.saga || b.titulo, "es") || (a.orden ?? 0) - (b.orden ?? 0);

function porNiveles(l, niveles) {
  const botones = `<div class="filtros">${niveles.map(([e, n]) => `<button data-filtro="${e}" aria-pressed="${filtro === e}">${e} ${n}</button>`).join("")}</div>`;
  return botones + niveles.filter(([e]) => !filtro || filtro === e).map(([e, n, num]) => {
    const t = l.filter(f => f.puntuacion === e).sort(porSaga);
    return t.length ? `<div class="tramo"><h3 class="cab">${e} ${n} <span>${num} · ${t.length}</span></h3>${lista(t)}</div>` : "";
  }).join("");
}

const VISTAS = {
  inicio() {
    const top = FICHAS.filter(f => f.tipo === "película" && f.top).sort((a, b) => a.top - b.top);
    const topS = FICHAS.filter(f => esSerie(f) && f.top).sort((a, b) => a.top - b.top);
    const ult = FICHAS.filter(f => f.fecha_vista).sort((a, b) => b.fecha_vista.localeCompare(a.fecha_vista)).slice(0, 12);
    const alta = FICHAS.filter(f => f.prioridad === "Alta" && /por /.test(f.estado));
    return (ult.length ? `<section><h2>Últimas vistas</h2><p class="sub">Lo último que has fichado.</p><div class="fila">${ult.map(f => posterFicha(f)).join("")}</div></section>` : "")
      + `<section><h2>Top 5 películas</h2><p class="sub">Tus cinco 🌟 de siempre.</p><div class="podio">${top.map(f => posterFicha(f, f.top)).join("")}</div></section>
      <section><h2>Top 5 series</h2><p class="sub">Las cinco que más te han marcado.</p><div class="podio">${topS.map(f => posterFicha(f, f.top)).join("")}</div></section>
      <section><h2>Para ver primero</h2><p class="sub">Prioridad alta de «Cosas que ver».</p>${lista(alta, {motivo: true})}</section>`;
  },
  peliculas() { const l = FICHAS.filter(f => f.tipo === "película" && f.estado === "vista" && coincide(f)); return `<section><h2>Películas vistas</h2><p class="sub">${l.length} películas, de 🌟 a 🔴.</p>${porNiveles(l, NIVELES)}</section>`; },
  series() { const l = FICHAS.filter(f => esSerie(f) && f.estado === "vista" && coincide(f)); return `<section><h2>Series vistas</h2><p class="sub">${l.length} series.</p>${porNiveles(l, NIVELES)}</section>`; },
  porver() {
    const p = FICHAS.filter(f => f.estado === "por ver" && coincide(f));
    const g = (t, s, l, o) => l.length ? `<section><h2>${t}</h2><p class="sub">${s}</p>${lista(l, o)}</section>` : "";
    const ord = k => (a, b) => (a[k] ?? 99) - (b[k] ?? 99);
    const prio = {Alta: 1, Media: 2, Baja: 3};
    return g("Cosas que ver", "Por prioridad: alta, media y baja.", p.filter(f => f.lista === "Cosas que ver").sort((a, b) => prio[a.prioridad] - prio[b.prioridad]), {motivo: true})
      + g("Cine raro pero potente", "Del nivel 1 (accesible) al 3 (extremo).", p.filter(f => f.lista === "Cine raro").sort(ord("nivel")), {motivo: true})
      + g("Ruta polaca", "En orden de visionado.", p.filter(f => f.lista === "Ruta polaca").sort(ord("orden_lista")), {motivo: true})
      + g("Clásicos", "Películas old.", p.filter(f => f.lista === "Clásicos"))
      + g("Otras películas", "", p.filter(f => f.tipo === "película" && !f.lista))
      + g("Series y anime", "", p.filter(esSerie))
      + g("Documentales", "", p.filter(f => f.tipo === "documental" || f.tipo === "serie documental"));
  },
  libros() {
    const l = FICHAS.filter(f => esLibro(f) && coincide(f));
    const pend = l.filter(f => f.estado === "por leer");
    const ruta = pend.filter(f => f.lista === "Ruta de lectura").sort((a, b) => (a.orden_lectura ?? 999) - (b.orden_lectura ?? 999));
    return `<section><h2>Libros leídos</h2><p class="sub">${l.filter(f => f.estado === "leído").length} libros. 🎧 = audiolibro.</p>${porNiveles(l.filter(f => f.estado === "leído"), NIVELES_LIBROS)}</section>
      <section><h2>Ruta de lectura</h2><p class="sub">${ruta.length} libros, en tu orden de prioridad (sin número: opcionales).</p>${lista(ruta, {motivo: true, ruta: true})}</section>
      <section><h2>Otros por leer</h2><p class="sub">Fuera de la ruta.</p>${lista(pend.filter(f => !f.lista))}</section>
      <section><h2>Recomendaciones polacas</h2><p class="sub">Literatura.</p>${lista(pend.filter(f => f.lista === "Recomendaciones polacas"))}</section>`;
  },
  cifras() {
    const barras = (pares, clase = "") => { const max = Math.max(...pares.map(p => p[1]), 1);
      return `<div class="barras">${pares.map(([k, n]) => `<div class="barra ${clase}"><span>${k}</span><i style="width:${n / max * 100}%"></i><span>${n}</span></div>`).join("")}</div>`; };
    const vistas = FICHAS.filter(f => f.tipo === "película" && f.estado === "vista");
    const series = FICHAS.filter(f => esSerie(f) && f.estado === "vista");
    const dec = {}; vistas.forEach(f => { if (f.año) { const d = Math.floor(f.año / 10) * 10 + "s"; dec[d] = (dec[d] || 0) + 1; } });
    const año = {}; FICHAS.filter(f => f.fecha_vista).forEach(f => { const a = f.fecha_vista.slice(0, 4); año[a] = (año[a] || 0) + 1; });
    const dir = {}; FICHAS.filter(f => f.estado === "vista" && f.director).forEach(f => dir[f.director] = (dir[f.director] || 0) + 1);
    const media = l => (l.reduce((s, f) => s + (f.nota || 0), 0) / (l.length || 1)).toFixed(1);
    return `<section><h2>Estadísticas</h2><p class="sub">Nota media: películas ${media(vistas)} · series ${media(series)}.</p>
      <div class="cols"><div><h3 class="cab">Películas por puntuación</h3>${barras(NIVELES.map(([e, n]) => [`${e} ${n}`, vistas.filter(f => f.puntuacion === e).length]))}</div>
      <div><h3 class="cab">Series por puntuación</h3>${barras(NIVELES.map(([e, n]) => [`${e} ${n}`, series.filter(f => f.puntuacion === e).length]), "b2")}</div>
      <div><h3 class="cab">Películas vistas por década</h3>${barras(Object.entries(dec).sort(), "b2")}</div>
      <div><h3 class="cab">Fichadas por año</h3>${Object.keys(año).length ? barras(Object.entries(año).sort()) : '<p class="vacio">Se irá llenando a medida que fiches con fecha.</p>'}</div>
      ${Object.keys(dir).length ? `<div><h3 class="cab">Directores más vistos</h3>${barras(Object.entries(dir).sort((a, b) => b[1] - a[1]).slice(0, 10), "b2")}</div>` : ""}</div></section>`;
  },
  todo() { return `<section><h2>Resultados</h2>${lista(FICHAS.filter(coincide).sort(porNota))}</section>`; },
};

function abrir(f) {
  const datos = [["Tipo", f.tipo], ["Estado", f.estado], ["Año", f.año], ["Director", f.director], ["Autor", f.autor],
    ["Saga", f.saga && `${f.saga}${f.orden ? ` (${f.orden})` : ""}`], ["Lista", f.lista && `${f.lista}${f.prioridad ? ` · prioridad ${f.prioridad.toLowerCase()}` : ""}${f.nivel ? ` · nivel ${f.nivel}` : ""}${f.orden_lista ? ` · nº ${f.orden_lista}` : ""}`],
    ["Tu nota", esLibro(f) && Number.isInteger(f.nota) ? f.nota : null], ["Ruta", f.orden_lectura && `nº ${f.orden_lectura} · fase ${f.fase}`],
    ["Lo tienes", f.en_casa ? "en casa" : f.epub ? "en epub (Drive)" : null], ["Vista el", f.fecha_vista && new Date(f.fecha_vista).toLocaleDateString("es-ES", {day: "numeric", month: "long", year: "numeric"})]].filter(d => d[1]);
  const enObsidian = location.protocol === "file:" ? `<a class="prin" href="obsidian://open?vault=${encodeURIComponent(BOVEDA)}&file=${encodeURIComponent(f.ruta)}">Abrir en Obsidian</a>` : "";
  $("#dialogo").innerHTML = `<div class="amp">${cartel(f, true)}<div><h2>${titulo(f)}</h2><p class="sub">${f.puntuacion ? `${f.puntuacion} ` : ""}${esc(sub(f))}</p>
    <dl>${datos.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${f.motivo ? `<p class="sub">${esc(f.motivo)}</p>` : ""}${f.comentario ? `<p class="coment">${esc(f.comentario)}</p>` : ""}
    <div class="acciones">${enObsidian}<button id="otra" hidden>🎲 Otra</button><button id="cerrar">Cerrar</button></div></div></div>`;
  $("#cerrar").onclick = () => $("#dialogo").close();
  $("#dialogo").showModal();
}
function alAzar() {
  const pend = FICHAS.filter(f => f.estado === "por ver" && (f.tipo === "película" || esSerie(f)));
  const peso = f => ({Alta: 4, Media: 2}[f.prioridad] || 1);
  let r = Math.random() * pend.reduce((s, f) => s + peso(f), 0);
  const f = pend.find(f => (r -= peso(f)) < 0) || pend[0];
  abrir(f);
  const otra = $("#otra"); otra.hidden = false; otra.onclick = alAzar;
}

function pintar() {
  $("#main").innerHTML = busqueda && vista === "inicio" ? VISTAS.todo() : VISTAS[vista]();
  document.querySelectorAll("nav [data-vista]").forEach(b => b.setAttribute("aria-pressed", b.dataset.vista === vista));
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-vista]"); if (!b) return; vista = b.dataset.vista; filtro = null; pintar(); scrollTo({top: 0}); });
$("#azar").addEventListener("click", alAzar);
$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-filtro]"); if (b) { filtro = filtro === b.dataset.filtro ? null : b.dataset.filtro; return pintar(); }
  const f = e.target.closest(".ficha"); if (f) abrir(FICHAS[f.dataset.id]);
});
$("#dialogo").addEventListener("click", e => { if (e.target.id === "dialogo") e.target.close(); });
$("#buscar").addEventListener("input", e => { busqueda = e.target.value.trim().toLowerCase(); pintar(); });
const cuenta = p => FICHAS.filter(p).length;
$("#cifras").innerHTML = `<div><b>${cuenta(f => f.tipo === "película" && f.estado === "vista")}</b>películas</div><div><b>${cuenta(f => esSerie(f) && f.estado === "vista")}</b>series</div><div><b>${cuenta(f => esLibro(f) && f.estado === "leído")}</b>libros</div><div><b>${cuenta(f => /por /.test(f.estado))}</b>pendientes</div>`;
$("#pie").textContent = `Se genera a partir de tus notas de Obsidian (Notas/Multimedia). Ficha nuevas con el formulario «Fichar».`;
pintar();
</script>
</body>
</html>
